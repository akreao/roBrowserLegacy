<div id="WinLogin" class="win_login">
	<div class="win_login">
		<ui-image src="login_interface/bg_login.tga"></ui-image>
		<!-- User Auth -->
		<input id="user" class="user" type="text" value="" maxlength="24" />
		<input id="pass" class="pass" type="password" value="" maxlength="24" />
		<button
			id="save"
			class="save"
			type="button"
			data-background="login_interface/checkbox_off.bmp"
			data-preload="login_interface/checkbox_on.bmp"
			data-on="login_interface/checkbox_on.bmp"
			data-off="login_interface/checkbox_off.bmp"
		></button>
		<ui-text class="save-label" msg="3411">Save ID</ui-text>

		<!-- Buttons -->
		<button
			class="btn replay"
			type="button"
			data-background="login_interface/bt_close_normal.bmp"
			data-hover="login_interface/bt_close_over.bmp"
			data-down="login_interface/bt_close_press.bmp"
		>
			Replay
		</button>
		<input type="file" class="replay-upload" accept=".rrf" style="display: none" />
		<button
			id="btn_connect"
			class="btn connect"
			type="submit"
			data-background="login_interface/bt_start_normal.bmp"
			data-hover="login_interface/bt_start_over.bmp"
			data-down="login_interface/bt_start_press.bmp"
		></button>
		<button
			id="btn_connect"
			class="btn signup"
			type="button"
			data-background="login_interface/bt_join_normal.bmp"
			data-hover="login_interface/bt_join_over.bmp"
			data-down="login_interface/bt_join_press.bmp"
		>
			<ui-text msg="3414">Sign Up</ui-text>
		</button>
		<button
			id="btn_exit"
			class="btn exit"
			type="button"
			data-background="login_interface/bt_close2_normal.bmp"
			data-hover="login_interface/bt_close2_over.bmp"
			data-down="login_interface/bt_close2_press.bmp"
		></button>
	</div>
</div>
