<div class="TipBox">
	<div class="titlebar" data-background="basic_interface/titlebar_mid.bmp">
		<div class="title"><ui-text msg="3238">TIPBOX</ui-text></div>
		<ui-button
			class="close"
			bg="basic_interface/sys_close_off.bmp"
			hover="basic_interface/sys_close_on.bmp"
		></ui-button>
	</div>
	<div class="picture-bg" data-background="tipbox/TipboxBG.bmp"></div>
	<div class="picture"></div>
	<div class="effects"></div>
	<div class="text-bg" data-background="tipbox/bg_tipbox.bmp"></div>
	<div class="bottom-bg" data-background="tipbox/btnbar_bottom.bmp"></div>

	<input class="search-text" type="text" maxlength="150" />
	<ui-button
		class="search"
		bg="tipbox/btn_searchbar_normal.bmp"
		hover="tipbox/btn_searchbar_over.bmp"
		down="tipbox/btn_searchbar_press.bmp"
	></ui-button>

	<div class="title-line first"></div>
	<div class="title-line second"></div>
	<div class="page"></div>
	<div class="results"></div>

	<div class="arrow prev" data-background="tipbox/bt_arrowL_off.bmp" data-active="tipbox/bt_arrowL_on.bmp"></div>
	<div class="arrow next" data-background="tipbox/bt_arrowR_off.bmp" data-active="tipbox/bt_arrowR_on.bmp"></div>

	<div class="startup">
		<div class="checkbox" data-background="tipbox/checkBox.bmp" data-active="tipbox/checkBox_check.bmp"></div>
		<ui-text msg="3939">Open on Startup</ui-text>
	</div>

	<ui-button
		class="close-button"
		bg="tipbox/btn_close_normal.bmp"
		hover="tipbox/btn_close_over.bmp"
		down="tipbox/btn_close_press.bmp"
		><ui-text msg="1299">Close</ui-text></ui-button
	>
</div>
